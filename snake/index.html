<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p id="hint">Press Start, then use the arrow keys.</p>
    <div class="controls">
      <button type="button" id="start">Start game</button>
      <button type="button" id="stop" disabled>Stop game</button>
    </div>
    <canvas id="board" width="600" height="600" tabindex="0" aria-label="Snake game board"></canvas>
  </main>
  <script src="game.js"></script>
</body>
</html>
